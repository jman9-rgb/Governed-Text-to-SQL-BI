<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6770"/></marker></defs>
<rect width="1000" height="720" fill="#ffffff"/>
<text x="500" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2a33">GenBI architecture: from a question to a measured answer</text>
<rect x="20" y="50" width="270" height="540" rx="12" fill="#2b6cb0" fill-opacity="0.10" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="155.0" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">1  GOVERNED KNOWLEDGE</text>
<rect x="40" y="90" width="230" height="60" rx="8" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.2"/>
<text x="155.0" y="117.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a33">Business context</text>
<text x="155.0" y="134.0" text-anchor="middle" font-size="11" fill="#5b6770">company, time rules, limits</text>
<rect x="40" y="170" width="230" height="60" rx="8" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.2"/>
<text x="155.0" y="197.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a33">Metric catalog</text>
<text x="155.0" y="214.0" text-anchor="middle" font-size="11" fill="#5b6770">columns + trusted KPIs</text>
<rect x="40" y="250" width="230" height="60" rx="8" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.2"/>
<text x="155.0" y="277.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a33">Business glossary</text>
<text x="155.0" y="294.0" text-anchor="middle" font-size="11" fill="#5b6770">words -> metrics, rules</text>
<rect x="40" y="330" width="230" height="60" rx="8" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.2"/>
<text x="155.0" y="357.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a33">Agent scope</text>
<text x="155.0" y="374.0" text-anchor="middle" font-size="11" fill="#5b6770">3 agents, own views, own DB user</text>
<rect x="40" y="420" width="230" height="60" rx="8" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.2"/>
<text x="155.0" y="447.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a33">Semantic views</text>
<text x="155.0" y="464.0" text-anchor="middle" font-size="11" fill="#5b6770">vw_sales, vw_monthly_sales, ...</text>
<rect x="40" y="500" width="230" height="60" rx="8" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.2"/>
<text x="155.0" y="527.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a33">Warehouse</text>
<text x="155.0" y="544.0" text-anchor="middle" font-size="11" fill="#5b6770">bronze > silver > gold (tables)</text>
<line x1="155" y1="480" x2="155" y2="500" stroke="#5b6770" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="320" y="50" width="360" height="540" rx="12" fill="#2f855a" fill-opacity="0.10" stroke="#2f855a" stroke-width="1.5"/>
<text x="500.0" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#2f855a">2  ASK AND ANSWER</text>
<rect x="345" y="90" width="310" height="50" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.2"/>
<text x="500.0" y="112.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a33">Business question</text>
<text x="500.0" y="129.0" text-anchor="middle" font-size="11" fill="#5b6770">sales | customer | product agent</text>
<rect x="345" y="160" width="310" height="50" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.2"/>
<text x="500.0" y="182.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a33">Prompt builder</text>
<text x="500.0" y="199.0" text-anchor="middle" font-size="11" fill="#5b6770">only that agent's context, from SQL</text>
<rect x="345" y="230" width="310" height="50" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.2"/>
<text x="500.0" y="252.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a33">Gemini (free tier)</text>
<text x="500.0" y="269.0" text-anchor="middle" font-size="11" fill="#5b6770">returns JSON: behavior + one SELECT</text>
<rect x="345" y="300" width="310" height="50" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.2"/>
<text x="500.0" y="322.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a33">Safety 1: text validator</text>
<text x="500.0" y="339.0" text-anchor="middle" font-size="11" fill="#5b6770">rules V01-V11 (app/genbi_validator.py)</text>
<rect x="345" y="370" width="310" height="50" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.2"/>
<text x="500.0" y="392.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a33">Safety 2: dry run</text>
<text x="500.0" y="409.0" text-anchor="middle" font-size="11" fill="#5b6770">genbi.sp_dry_run: compiles for this agent?</text>
<rect x="345" y="440" width="310" height="50" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.2"/>
<text x="500.0" y="462.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a33">Safety 3: database permissions</text>
<text x="500.0" y="479.0" text-anchor="middle" font-size="11" fill="#5b6770">runs as agent user, other objects = error 229</text>
<rect x="345" y="510" width="310" height="50" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.2"/>
<text x="500.0" y="532.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a33">Answer</text>
<text x="500.0" y="549.0" text-anchor="middle" font-size="11" fill="#5b6770">Answer | Assumption | Clarify | Decline | Redirect</text>
<line x1="500.0" y1="140" x2="500.0" y2="160" stroke="#5b6770" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="500.0" y1="210" x2="500.0" y2="230" stroke="#5b6770" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="500.0" y1="280" x2="500.0" y2="300" stroke="#5b6770" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="500.0" y1="350" x2="500.0" y2="370" stroke="#5b6770" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="500.0" y1="420" x2="500.0" y2="440" stroke="#5b6770" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="500.0" y1="490" x2="500.0" y2="510" stroke="#5b6770" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="500" y="577" text-anchor="middle" font-size="11" fill="#5b6770">cache hit skips Gemini; daily budget stops runaway cost</text>
<rect x="710" y="50" width="270" height="540" rx="12" fill="#c05621" fill-opacity="0.10" stroke="#c05621" stroke-width="1.5"/>
<text x="845.0" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#c05621">3  OBSERVE</text>
<rect x="730" y="90" width="230" height="60" rx="8" fill="#ffffff" stroke="#c05621" stroke-width="1.2"/>
<text x="845.0" y="117.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a33">Query log</text>
<text x="845.0" y="134.0" text-anchor="middle" font-size="11" fill="#5b6770">every question, outcome, timings</text>
<rect x="730" y="170" width="230" height="60" rx="8" fill="#ffffff" stroke="#c05621" stroke-width="1.2"/>
<text x="845.0" y="197.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a33">Feedback</text>
<text x="845.0" y="214.0" text-anchor="middle" font-size="11" fill="#5b6770">thumbs up/down + reason, review queue</text>
<rect x="730" y="250" width="230" height="60" rx="8" fill="#ffffff" stroke="#c05621" stroke-width="1.2"/>
<text x="845.0" y="277.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a33">Cost guardrails</text>
<text x="845.0" y="294.0" text-anchor="middle" font-size="11" fill="#5b6770">daily call limit, cache, usage ledger</text>
<rect x="730" y="330" width="230" height="60" rx="8" fill="#ffffff" stroke="#c05621" stroke-width="1.2"/>
<text x="845.0" y="357.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a33">Monitoring views</text>
<text x="845.0" y="374.0" text-anchor="middle" font-size="11" fill="#5b6770">8 views, read-only role</text>
<rect x="730" y="410" width="230" height="60" rx="8" fill="#ffffff" stroke="#c05621" stroke-width="1.2"/>
<text x="845.0" y="437.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a33">Power BI dashboard</text>
<text x="845.0" y="454.0" text-anchor="middle" font-size="11" fill="#5b6770">health | cost | quality | evaluation</text>
<line x1="845" y1="150" x2="845" y2="170" stroke="#5b6770" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="845" y1="230" x2="845" y2="250" stroke="#5b6770" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="845" y1="310" x2="845" y2="330" stroke="#5b6770" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="845" y1="390" x2="845" y2="410" stroke="#5b6770" stroke-width="1.6" marker-end="url(#ar)"/>
<polyline points="270,200 305,200 305,185 345,185" fill="none" stroke="#5b6770" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<polyline points="655,535 695,535 695,120 730,120" fill="none" stroke="#5b6770" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<line x1="655" y1="255" x2="730" y2="280" stroke="#5b6770" stroke-width="1.6" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<rect x="20" y="610" width="960" height="96" rx="12" fill="#6b46c1" fill-opacity="0.10" stroke="#6b46c1" stroke-width="1.5"/>
<text x="500.0" y="634" text-anchor="middle" font-size="14" font-weight="700" fill="#6b46c1">4  IMPROVE (measure > diagnose > fix > log > measure again)</text>
<rect x="40" y="640" width="226" height="52" rx="8" fill="#ffffff" stroke="#6b46c1" stroke-width="1.2"/>
<text x="153.0" y="663.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a33">46 golden questions</text>
<text x="153.0" y="680.0" text-anchor="middle" font-size="11" fill="#5b6770">answer key from trusted SQL</text>
<rect x="300" y="640" width="196" height="52" rx="8" fill="#ffffff" stroke="#6b46c1" stroke-width="1.2"/>
<text x="398.0" y="663.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a33">Evaluation run</text>
<text x="398.0" y="680.0" text-anchor="middle" font-size="11" fill="#5b6770">behavior + result vs key</text>
<rect x="530" y="640" width="196" height="52" rx="8" fill="#ffffff" stroke="#6b46c1" stroke-width="1.2"/>
<text x="628.0" y="663.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a33">Failure analysis</text>
<text x="628.0" y="680.0" text-anchor="middle" font-size="11" fill="#5b6770">cause: data, prompt or scorer</text>
<rect x="760" y="640" width="200" height="52" rx="8" fill="#ffffff" stroke="#6b46c1" stroke-width="1.2"/>
<text x="860.0" y="663.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2a33">Change log</text>
<text x="860.0" y="680.0" text-anchor="middle" font-size="11" fill="#5b6770">what changed, why, which questions</text>
<line x1="266" y1="666" x2="300" y2="666" stroke="#5b6770" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="496" y1="666" x2="530" y2="666" stroke="#5b6770" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="726" y1="666" x2="760" y2="666" stroke="#5b6770" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="500" y="718" text-anchor="middle" font-size="10" fill="#8a949c">Fixes go back into zone 1 (metric catalog, glossary, catalog rules) or the prompt rules, then the evaluation runs again.</text>
</svg>